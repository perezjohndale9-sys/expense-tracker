<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Create account · MCC Expense Tracker</title>
<link rel="icon" href="logo.png">
<meta name="theme-color" content="#BE1E2D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="signup">
<main class="loginwrap">
<div class="card loginbox">
<img src="logo.png" alt="MCC logo" width="64" height="64">
<h2>Create your account</h2>
<small style="color:var(--muted)">Mabalacat City College · Free, and your data stays private</small>
<input id="lemail" type="email" placeholder="Email" autocomplete="email">
<input id="lpass" type="password" placeholder="Password (min. 6 characters)" autocomplete="new-password">
<input id="lpass2" type="password" placeholder="Confirm password" autocomplete="new-password">
<button class="btn" id="go">Create account</button>
<small id="lmsg" style="color:var(--exp)"></small>
<small class="alt-link">Already have an account? <a href="login.html">Log in</a></small>
</div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth.js"></script>
</body>
</html>
